name = "jinro-realtime"
main = "index.ts"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# 旧設定（失敗した構成情報）を明示的にリセット
[[migrations]]
tag = "v1"
deleted_classes = ["GameRoom"]

# SQLite ストレージを使用する新たなクラスとして強制再作成
[[migrations]]
tag = "v2"
new_sqlite_classes = ["GameRoom"]
